<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website for assignment submissions for CS1130">
    <title>Web Development Assignment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <main id="main">

        <!--HERO SECTION-->
       <section class="tool-header-section">
            <div class="glow glow-1" aria-hidden="true"></div>
            <div class="glow glow-2" aria-hidden="true"></div>

            <div class="container">
                <h1><span class="highlight">Conversion</span> Program</h1>
                <p class="lede">Convert between metric and imperial units.</p>
            </div>
        </section>

        <section class="programs">
            <div class="container"> 
                <article class="card tool-card">
                    <div class="card-header-area">
                        <div class="custom-select-wrapper" id="custom-dropdown">
                            <button type="button" class="title-select" id="dropdown-trigger" aria-expanded="false" aria-haspopup="listbox">
                                <span id="selected-text">Length Converter</span>
                                <svg class="title-arrow" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </button>

                            <ul class="custom-menu" role="listbox" id="dropdown-menu">
                                <li role="option">
                                    <button type="button" class="menu-option" data-value="length">Length Converter</button>
                                </li>
                                <li role="option">
                                    <button type="button" class="menu-option" data-value="temperature">Temperature Converter</button>
                                </li>
                            </ul>
                        </div>
                        
                        <p class="formula-text" id="formula-display">Formula: ft = m × 3.28084 (non-negative length only)</p>
                    </div>

                    <form id="conversion-form">
                        <div class="input-group-wrapper">
                            <div class="input-field">
                                <label for="input-value" id="label-from">Length in Meters (m)</label>
                                <input type="number" id="input-value" placeholder="e.g. 10" required step="any">
                            </div>
                            <button type="button" id="inverse-btn" class="btn inverse-btn" aria-label="Inverse Conversion">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M17 3l4 4-4 4"></path>
                                <path d="M3 7h18"></path>
                                <path d="M7 21l-4-4 4-4"></path>
                                <path d="M21 17H3"></path>
                            </svg>
                            </button>
                            <button type="submit" class="btn btn-primary convert-btn">Convert</button>
                        </div>

                        <div class="result-box">
                            <span class="result-label" id="label-to">Result in Feet</span>
                            <div class="result-value-wrapper">
                                <span class="result-number" id="output-value">32.81</span>
                                <span class="result-unit" id="output-unit">ft</span>
                            </div>
                            <p class="result-math" id="math-display">10 × 3.28084 = 32.81 ft</p>
                        </div>
                    </form>
                </article>
            </div>  
        </section>
    </main>
    <script src="../js/components.js" defer></script>
    <script src="../js/main.js" defer></script>
</body>

</html>
