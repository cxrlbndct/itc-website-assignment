<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A website for assignment submissions for CS1130">
    <title>Web Development Assignment</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <main id="main">
        <section class="tool-header-section">
            <div class="glow glow-1" aria-hidden="true"></div>
            <div class="glow glow-2" aria-hidden="true"></div>
            <div class="container">
                <h1><span class="highlight">Simple Payroll</span> Program</h1>
                <p class="lede">Add or delete employees to calculate their net pay.</p>
            </div>
        </section>

        <section class="programs">
            <div class="container">
             
                <article class="card tool-card" style="max-width: 100%; margin-bottom: var(--space-6);">
                    <div class="card-header-area">
                        <h2>Add Employee</h2>
                        <p class="formula-text">Gross Pay = Days Worked × Daily Rate</p>
                    </div>

                    <form id="payroll-form">
                        <div class="payroll-input-grid">
                            <div class="input-field">
                                <label for="emp-name">Employee Name</label>
                                <input type="text" id="emp-name" placeholder="John Doe" required>
                            </div>
                            <div class="input-field">
                                <label for="emp-days">Days Worked</label>
                                <input type="number" id="emp-days" placeholder="e.g. 15" required min="1" step="any">
                            </div>
                            <div class="input-field">
                                <label for="emp-rate">Daily Rate (PHP)</label>
                                <input type="number" id="emp-rate" placeholder="e.g. 500" required min="0" step="any">
                            </div>
                            <div class="input-field">
                                <label for="emp-deduction">Deduction Amount (PHP)</label>
                                <input type="number" id="emp-deduction" placeholder="e.g. 100" required min="0" step="any">
                            </div>
                        </div>

                        <div class="payroll-action-buttons">
                            <button type="submit" class="btn btn-primary">Add Employee</button>
                            <button type="button" id="btn-delete" class="btn inverse-btn" style="width: auto; padding-inline: var(--space-4);">
                                Delete by Line No.
                            </button>
                        </div>
                    </form>
                </article>

                <article class="card tool-card" style="max-width: 100%;">
                    <div class="card-header-area">
                        <h2>Payroll List</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="tax-table">
                            <thead>
                                <tr>
                                    <th>No.</th>
                                    <th>Employee Name</th>
                                    <th>Days Worked</th>
                                    <th>Daily Rate</th>
                                    <th>Gross Pay</th>
                                    <th>Deduction</th>
                                    <th>Net Pay</th>
                                </tr>
                            </thead>
                            <tbody id="payroll-table-body">
                                <tr id="empty-state">
                                    <td colspan="7" style="text-align: center; padding: var(--space-6); color: var(--color-text-secondary);">
                                        No employees added yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </article>

            </div>
        </section>
    </main>
    <script src="../js/components.js" defer></script>
    <script src="../js/main.js" defer></script>
</body>

</html>
